name: Build Docker Image Only

on:
  push:
    branches:
      - '*'


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
          contents: read
          packages: write
    # Додаємо блок services для запуску контейнерів поруч із тестами

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services

        run: | 
         cd ./
         docker compose up -d
        
      - name: Set image tag
        run: |
          TIMESTAMP=$(date +%s)
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "IMAGE_TAG=${TIMESTAMP}-${SHA}" >> $GITHUB_ENV


      - name: Install dependencies and run tests
        env:
          # Жестко переопределяем URL, чтобы избежать подключения к Postgres 'db'
          DATABASE_URL: 'sqlite:///:memory:'
        run: |
          cd ./app
          pip install -r requirements.txt
          pytest test_app.py -v
      - uses: actions/checkout@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5.3.0
        with:
          context: ./app
          push: true
          tags: ghcr.io/dmitriy282/my-app:${{ env.IMAGE_TAG }}
      
      - name: Copy docker-compose to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./docker-compose.yml"
          target: "/home/ubuntu"

      - name: Copy config.alloy to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./config.alloy"
          target: "/home/ubuntu"
      
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
        
          script: |
            # Логинимся в GHCR уже внутри вашего сервера
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            sudo usermod -aG docker $USER

            newgrp docker

            # Скачиваем обновленный образ
            docker pull ghcr.io/dmitriy282/my-app:${{ env.IMAGE_TAG }}


            cd /home/ubuntu

            # Запускаем новый контейнер
            docker compose up -d
      - name: Send Deployment Annotation to Grafana
        if: success()
        run: |
          curl -X POST -H "Authorization: Bearer ${{ secrets.GRAFANA_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{
            "time": '$(date +%s%3N)',
            "isRegion": false,
            "tags": ["deploy", "production", "github-actions"],
            "text": "Deployment of space-explorer-logbook triggered by ${{ github.actor }}. Commit: ${{ github.sha }}"
          }' \
          ${{ secrets.GRAFANA_URL }}/api/annotations