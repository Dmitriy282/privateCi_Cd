name: Build Docker Image Only

on:
    push:
        branches:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            # 1. Завантажуємо код з репозиторію
            - name: Checkout code
              uses: actions/checkout@v4
            
            # 2. Тільки збираємо образ (БЕЗ відправки)
            - name: Build Docker image
              uses: docker/build-push-action@v5.3.0
              with:
                context: ./app
                push: false   # <--- ГОЛОВНА ЗМІНА (було true)
                tags: test-image:latest # Просто тестова назва для локальної збірки
            - name: Install dependencies
              run: cd ./app && pip install -r requirements.txt && pytest test_app.py -v

