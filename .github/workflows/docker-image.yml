name: Build Docker Image Only

on:
  push:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    # 1. Відступи services на одному рівні з runs-on та steps
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Додано крок для налаштування Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Вкажіть потрібну вам версію

      # 3. Об'єднано env та run в одному кроці. 
      # 4. Виправлено логін, пароль, назву БД та хост (localhost)
      - name: Install dependencies and Run Tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          TESTING: "True"
        run: |
          cd ./app
          pip install -r requirements.txt
          pytest test_app.py -v
          
      - name: Build Docker image
        uses: docker/build-push-action@v5.3.0
        with:
          context: ./app
          push: false
          tags: test-image:latest
