version: '3.8'

services:

  web:
    image: ghcr.io/dmitriy282/my-app:latest
    ports:
      - "5000:5000"
    restart: unless-stopped

    environment:
      - DATABASE_URL=postgresql://space_admin:supersecret@db:5432/space_logbook
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=space_admin
      - POSTGRES_PASSWORD=supersecret
      - POSTGRES_DB=space_logbook
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U space_admin"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
   
  alloy:
    image: grafana/alloy:v1.2.1
    container_name: alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    environment:
      - GC_LOKI_URL=https://<your-loki-endpoint>/loki/api/v1/push
      - GC_LOKI_USER=<your-loki-user-id>
      - GC_PROMETHEUS_URL=https://<your-prometheus-endpoint>/api/v1/push
      - GC_PROMETHEUS_USER=<your-prometheus-user-id>
      - GC_API_KEY=<your-grafana-cloud-api-key>
    restart: unless-stopped

volumes:
  pgdata:
